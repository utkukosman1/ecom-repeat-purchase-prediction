[project]
name = "ecom-repeat-purchase"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "fastexcel>=0.20.2",
    "joblib>=1.5.3",
    "lightgbm>=4.7.0",
    "matplotlib>=3.11.1",
    "pandas>=3.0.5",
    "polars>=1.43.2",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.4",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "shap>=0.52.0",
    "uvicorn[standard]>=0.52.3",
    "xgboost>=3.4.1",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "ipykernel>=7.3.0",
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
